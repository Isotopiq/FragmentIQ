# Easypanel Docker Compose deployment template for FragmentIQ.
# Deploy this file directly in Easypanel (or docker compose -f docker-compose.easypanel.yml up -d).
# The frontend nginx image proxies /api to the backend service, so only port 80 needs to be exposed.

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/database/fragmentiq.db
      STORAGE_ROOT: /app/data
      SIRIUS_USE_API: true
      SIRIUS_API_URL: http://sirius:9999
    volumes:
      - fragmentiq-data:/app/data
      - ./example_workflows:/app/example_workflows:ro
    expose:
      - 8000
    depends_on:
      - redis
      - sirius
    restart: unless-stopped

  sirius:
    image: rformassspectrometry/rusirius:latest
    entrypoint: ["/home/rstudio/sirius/bin/sirius"]
    command: ["service", "-p", "9999", "-s", "--headless"]
    expose:
      - 9999
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/api/info').read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    ports:
      - "47832:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  fragmentiq-data:
