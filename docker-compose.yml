services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/database/fragmentiq.db
      STORAGE_ROOT: /app/data
    volumes:
      - ./data:/app/data
      - ./example_workflows:/app/example_workflows:ro
    ports:
      - "8001:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    ports:
      - "3001:80"
    depends_on:
      - backend

  worker-mzmine:
    build:
      context: ./workers/mzmine
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./example_workflows:/app/example_workflows:ro

  worker-sirius:
    build:
      context: ./workers/sirius
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data

  worker-ms2ml:
    build:
      context: ./workers/ms2ml
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data

  worker-stats:
    build:
      context: ./workers/stats
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data

volumes:
  redis-data:
