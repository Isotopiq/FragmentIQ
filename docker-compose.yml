services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/database/fragmentiq.db
      STORAGE_ROOT: /app/data
      SIRIUS_USE_API: true
      SIRIUS_API_URL: http://sirius:9999
    volumes:
      - ./data:/app/data
      - ./example_workflows:/app/example_workflows:ro
    ports:
      - "47830:8000"
    depends_on:
      - redis
      - sirius

  sirius:
    image: rformassspectrometry/rusirius:latest
    entrypoint: ["/home/rstudio/sirius/bin/sirius"]
    command: ["service", "-p", "9999", "-s", "--headless"]
    ports:
      - "47833:9999"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/api/info').read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    ports:
      - "47831:80"
    depends_on:
      - backend

  worker-mzmine:
    build:
      context: ./workers/mzmine
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./example_workflows:/app/example_workflows:ro

  worker-sirius:
    build:
      context: ./workers/sirius
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data

  worker-ms2ml:
    build:
      context: ./workers/ms2ml
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data

  worker-stats:
    build:
      context: ./workers/stats
    profiles: ["workers"]
    env_file: .env
    volumes:
      - ./data:/app/data

volumes:
  redis-data:
